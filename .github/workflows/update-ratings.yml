name: Update Meta Quest Ratings

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz zawartość repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Playwright i Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Pobierz oceny Meta Quest i licznik Tabletowo
        run: |
          python3 - << 'EOF'
          import json
          import re
          import urllib.request
          import urllib.parse
          from playwright.sync_api import sync_playwright

          APPS = {
              "lightkeepers": "https://www.meta.com/pl-pl/experiences/the-lightkeepers-protect-the-lighthouse/27856043040707456/",
              "mdns": "https://www.meta.com/pl-pl/experiences/medieval-dynasty-new-settlement/5900444653303887/",
              "bulletstorm": "https://www.meta.com/pl-pl/experiences/bulletstorm-vr/6565887093433499/",
              "ghvr": "https://www.meta.com/pl-pl/experiences/green-hell-vr/3815577785147028/"
          }

          TABLETOWO_SLUG = "kpisula"
          TABLETOWO_AUTHOR_URL = f"https://www.tabletowo.pl/author/{TABLETOWO_SLUG}/"

          with open("assets/ratings.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          data.pop("blairwitch", None)

          def extract_app_id(url):
              match = re.search(r'/(\d{10,20})/?', url)
              return match.group(1) if match else None

          def fetch_via_graphql(app_id):
              token = "OC|1317831034909742|"
              endpoint = "https://graph.oculus.com/graphql"
              variables = json.dumps({"applicationID": app_id})
              payload = urllib.parse.urlencode({
                  "access_token": token,
                  "doc_id": "3828663700542720",
                  "variables": variables
              }).encode("utf-8")
              req = urllib.request.Request(endpoint, data=payload, headers={
                  "User-Agent": "Mozilla/5.0",
                  "Content-Type": "application/x-www-form-urlencoded"
              })
              raw = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", errors="ignore")
              score_m = re.search(r'"quality_rating_aggregate"\s*:\s*([0-9.]+)', raw)
              count_m = re.search(r'"total_rating_count"\s*:\s*([0-9]+)', raw)
              return (
                  round(float(score_m.group(1)), 1) if score_m else None,
                  int(count_m.group(1)) if count_m else None
              )

          def count_page_articles(page):
              cnt = page.locator("main article").count()
              if cnt == 0:
                  cnt = page.locator("article").count()
              return cnt

          def fetch_tabletowo_count(context, page):
              author_id = None

              # Metoda 1: WordPress REST API (pobranie ID autora + nagłówek X-WP-Total)
              try:
                  u_resp = context.request.get(
                      f"https://www.tabletowo.pl/wp-json/wp/v2/users?slug={TABLETOWO_SLUG}",
                      timeout=20000
                  )
                  if u_resp.ok:
                      users = u_resp.json()
                      if isinstance(users, list) and len(users) > 0 and "id" in users[0]:
                          author_id = users[0]["id"]
                          print(f"[Tabletowo] Znaleziono ID autora przez API: {author_id}")
              except Exception as e:
                  print(f"[Tabletowo] Info API users: {e}")

              page_html = ""
              if not author_id:
                  try:
                      page.goto(TABLETOWO_AUTHOR_URL, wait_until="domcontentloaded", timeout=35000)
                      page.wait_for_timeout(2500)
                      page_html = page.content()
                      id_m = re.search(r'<body[^>]*class="[^"]*\bauthor-(\d+)\b', page_html)
                      if id_m:
                          author_id = int(id_m.group(1))
                          print(f"[Tabletowo] Wyciągnięto ID autora z HTML: {author_id}")
                  except Exception as e:
                      print(f"[Tabletowo] Błąd ładowania profilu: {e}")

              if author_id:
                  try:
                      p_resp = context.request.get(
                          f"https://www.tabletowo.pl/wp-json/wp/v2/posts?author={author_id}&per_page=1",
                          timeout=20000
                      )
                      if p_resp.ok:
                          total = p_resp.headers.get("x-wp-total")
                          if total and str(total).isdigit():
                              print(f"[SUKCES Tabletowo API] Liczba publikacji: {total}")
                              return int(total)
                  except Exception as e:
                      print(f"[Tabletowo] Info API posts: {e}")

              # Metoda 2: Zapasowe zliczanie na podstawie paginacji profilu autora
              try:
                  if not page_html:
                      page.goto(TABLETOWO_AUTHOR_URL, wait_until="domcontentloaded", timeout=35000)
                      page.wait_for_timeout(2500)
                      page_html = page.content()

                  per_page = count_page_articles(page)
                  page_nums = [int(n) for n in re.findall(rf'/author/{TABLETOWO_SLUG}/page/(\d+)/?', page_html)]

                  if per_page > 0 and page_nums:
                      max_page = max(page_nums)
                      page.goto(f"{TABLETOWO_AUTHOR_URL}page/{max_page}/", wait_until="domcontentloaded", timeout=35000)
                      page.wait_for_timeout(2500)
                      last_page_count = count_page_articles(page)
                      if last_page_count > 0:
                          total = (max_page - 1) * per_page + last_page_count
                          print(f"[SUKCES Tabletowo Paginacja] {max_page} stron -> {total} publikacji")
                          return total
                  elif per_page > 0:
                      print(f"[SUKCES Tabletowo 1 strona] {per_page} publikacji")
                      return per_page
              except Exception as e:
                  print(f"[BŁĄD Tabletowo Paginacja] {e}")

              return None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  locale="en-US",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
              )
              page = context.new_page()

              for key, url in APPS.items():
                  if key not in data:
                      data[key] = {"score": 0, "count": 0}

                  app_id = extract_app_id(url)
                  print(f"\n--- Sprawdzam {key} (ID: {app_id}) ---")

                  if app_id:
                      try:
                          score, count = fetch_via_graphql(app_id)
                          if score and count:
                              data[key]["score"] = score
                              data[key]["count"] = count
                              print(f"[SUKCES GraphQL] {key}: {score} ({count} ocen)")
                              continue
                      except Exception as e:
                          print(f"[Info GraphQL] Nie udało się ({e}), próbuję przez przeglądarkę...")

                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=35000)
                      page.wait_for_timeout(4000)

                      cookie_buttons = [
                          "Allow all cookies",
                          "Accept all",
                          "Decline optional cookies",
                          "Zezwól na wszystkie pliki cookie",
                          "Odrzuć opcjonalne pliki cookie"
                      ]
                      for btn_text in cookie_buttons:
                          btn = page.locator(f"text={btn_text}").first
                          if btn.is_visible():
                              btn.click()
                              page.wait_for_timeout(2000)
                              break

                      html = page.content()
                      body_text = page.inner_text("body")

                      score_m = re.search(r'"quality_rating_aggregate"\s*:\s*([0-9.]+)', html) or re.search(r'"ratingValue"\s*:\s*"?([0-9.]+)"?', html)
                      count_m = re.search(r'"total_rating_count"\s*:\s*([0-9]+)', html) or re.search(r'"ratingCount"\s*:\s*"?([0-9]+)"?', html)

                      if not (score_m and count_m):
                          t_match = re.search(r'([1-5][.,][0-9])\s*\(?([0-9\s,.]{1,8})\s*(?:ratings|reviews|ocen|oceny|\))', body_text, re.IGNORECASE)
                          if t_match:
                              data[key]["score"] = round(float(t_match.group(1).replace(",", ".")), 1)
                              raw_count = re.sub(r'[^\d]', '', t_match.group(2))
                              if raw_count:
                                  data[key]["count"] = int(raw_count)
                              print(f"[SUKCES Tekst] {key}: {data[key]}")
                              continue

                      if score_m:
                          data[key]["score"] = round(float(score_m.group(1)), 1)
                      if count_m:
                          data[key]["count"] = int(count_m.group(1))

                      if data[key]["count"] > 0:
                          print(f"[SUKCES HTML] {key}: {data[key]}")
                      else:
                          print(f"[UWAGA] Nie znaleziono liczby ocen dla {key}. Fragment tekstu ze strony:")
                          print(body_text[:400].replace("\n", " "))
                  except Exception as e:
                      print(f"[BŁĄD Playwright] {key}: {e}")

              print("\n--- Sprawdzam licznik publikacji Tabletowo.pl ---")
              tabletowo_count = fetch_tabletowo_count(context, page)
              if tabletowo_count and tabletowo_count > 0:
                  data["tabletowo"] = {"count": tabletowo_count}
              else:
                  print("[UWAGA] Nie udało się pobrać liczby publikacji z Tabletowo.pl")

              browser.close()

          with open("assets/ratings.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Zapisz zaktualizowane dane w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ratings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update ratings and Tabletowo stats" && git push)
